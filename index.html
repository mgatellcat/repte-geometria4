<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Repte de Geometria · 4t de primària</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b2d42;--muted:#6b6f85;--bg:#f4f8fc;--grid:#cfe3f5;--card:#fff;--ok:#2fa36b;--okbg:#e5f6ec;--ko:#e5484d;--kobg:#fdecec;--acc:#5b5bd6;--sun:#ffc93c}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:Nunito,system-ui,sans-serif;color:var(--ink);background-color:var(--bg);
background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:26px 26px;}
#app{max-width:980px;margin:0 auto;padding:18px 16px 60px}
h1,h2,h3,.ff{font-family:Fredoka,Nunito,sans-serif}
button{font-family:inherit;cursor:pointer}
.hero{text-align:center;padding:18px 10px 8px}
.hero h1{font-size:clamp(30px,5vw,48px);margin:0;letter-spacing:.5px}
.hero h1 span{display:inline-block}
.hero p{font-size:19px;color:var(--muted);margin:8px 0 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:22px}
.mcard{background:var(--card);border-radius:22px;padding:18px 18px 16px;border:3px solid var(--ink);box-shadow:6px 6px 0 var(--ink);text-align:left;display:flex;gap:14px;align-items:center;transition:transform .12s,box-shadow .12s;font-size:16px}
.mcard:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 var(--ink)}
.mcard:active{transform:translate(3px,3px);box-shadow:3px 3px 0 var(--ink)}
.mcard .em{font-size:40px;width:64px;height:64px;border-radius:18px;display:grid;place-items:center;flex:none;border:3px solid var(--ink)}
.mcard h3{margin:0;font-size:22px}
.mcard small{color:var(--muted);font-size:15px;display:block;margin-top:2px}
.mcard .stars{font-size:18px;margin-top:4px;letter-spacing:2px}
.mcard.final{grid-column:1/-1;background:linear-gradient(120deg,#fff6d6,#ffe1ec);justify-content:center}
.mcard.final .em{background:var(--sun)}
.tip{margin:26px auto 0;max-width:640px;background:#fff;border-radius:16px;padding:14px 18px;border:2px dashed #9bb8d6;font-size:16px;color:var(--muted);text-align:center}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mt{font-family:Fredoka;font-size:22px;font-weight:600;text-align:center}
.ghostbtn{background:#fff;border:2.5px solid var(--ink);border-radius:14px;padding:9px 14px;font-weight:800;font-size:15px;color:var(--ink)}
.ghostbtn:hover{background:#fff8de}
.prog{height:14px;background:#fff;border:2.5px solid var(--ink);border-radius:20px;margin:14px 0 6px;overflow:hidden}
.prog div{height:100%;background:linear-gradient(90deg,#7bd389,#3fb5e8);transition:width .4s}
.count{font-size:15px;color:var(--muted);font-weight:700;text-align:center}
.qcard{background:var(--card);border:3px solid var(--ink);border-radius:26px;box-shadow:7px 7px 0 var(--ink);padding:22px 22px 24px;margin-top:14px}
.prompt{font-family:Fredoka;font-size:clamp(21px,3vw,27px);font-weight:600;text-align:center;line-height:1.25}
.prompt .sub{display:block;font-family:Nunito;font-size:16px;color:var(--muted);font-weight:700;margin-top:6px}
#figbox{display:flex;justify-content:center;margin:12px 0 4px}
.fig{width:100%;max-width:400px;height:auto;display:block}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:16px}
.opt{background:#fff;border:3px solid var(--ink);border-radius:18px;padding:16px 12px;font-size:20px;font-weight:800;color:var(--ink);min-height:62px;box-shadow:4px 4px 0 var(--ink);transition:transform .1s}
.opt:hover:not(:disabled){background:#fff8de;transform:translateY(-2px)}
.opt:disabled{cursor:default}
.opt.right{background:var(--okbg);border-color:var(--ok);box-shadow:4px 4px 0 var(--ok);color:#1d6b45}
.opt.wrong{background:var(--kobg);border-color:var(--ko);box-shadow:4px 4px 0 var(--ko);color:#a32227}
.opt.dim{opacity:.45}
.tf{grid-template-columns:1fr 1fr}
.tf .opt{font-size:24px;min-height:80px}
.fb{margin-top:18px;border-radius:18px;padding:16px 18px;font-size:18px;line-height:1.45;border:3px solid}
.fb.ok{background:var(--okbg);border-color:var(--ok)}
.fb.ko{background:var(--kobg);border-color:var(--ko)}
.fb.info{background:#fff7dc;border-color:#e2b93b}
.fb b.big{font-family:Fredoka;font-size:23px;display:block;margin-bottom:4px}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.primary{background:var(--acc);color:#fff;border:3px solid var(--ink);border-radius:18px;padding:14px 26px;font-size:20px;font-weight:800;box-shadow:4px 4px 0 var(--ink)}
.primary:hover:not(:disabled){filter:brightness(1.08)}
.primary:disabled{opacity:.4;cursor:default}
.secondary{background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:18px;padding:14px 22px;font-size:18px;font-weight:800;box-shadow:4px 4px 0 var(--ink)}
.tapfig{cursor:pointer}
.tapfig [data-el]{cursor:pointer}
/* ordenar */
.hint{color:var(--muted);font-weight:700;font-size:15px;text-align:center;margin-top:6px}
.tray{min-height:120px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:12px;margin-top:12px;background:#f6f9ff;border:2.5px dashed #9bb8d6;border-radius:18px}
.tray.over{background:#eaf2ff}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:14px}
.bin{border:3px solid var(--c);background:color-mix(in srgb,var(--c) 12%,#fff);border-radius:20px;min-height:170px;padding:10px;cursor:pointer;transition:transform .1s}
.bin.over{transform:scale(1.02);background:color-mix(in srgb,var(--c) 26%,#fff)}
.bin .bt{font-family:Fredoka;font-weight:600;font-size:19px;text-align:center;color:var(--ink)}
.bin .bd{font-size:13.5px;text-align:center;color:var(--muted);font-weight:700;margin-bottom:6px}
.bin .bc{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.card{width:112px;background:#fff;border:2.5px solid var(--ink);border-radius:14px;padding:4px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;box-shadow:3px 3px 0 var(--ink)}
.card svg{width:100%;height:auto;display:block;pointer-events:none}
.card.sel{outline:4px solid var(--sun);outline-offset:2px}
.card.dragging{opacity:.3}
.card.ok{border-color:var(--ok);box-shadow:3px 3px 0 var(--ok);background:var(--okbg)}
.card.ko{border-color:var(--ko);box-shadow:3px 3px 0 var(--ko);background:var(--kobg)}
.ghost{position:fixed;pointer-events:none;z-index:50;opacity:.9;transform:rotate(-4deg) scale(1.05);box-shadow:6px 6px 0 rgba(0,0,0,.25)}
/* modal */
.modal{position:fixed;inset:0;background:rgba(30,32,50,.55);display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;z-index:40;overflow:auto}
.modal .box{background:#fff;border:3px solid var(--ink);border-radius:24px;max-width:860px;width:100%;padding:20px 22px 24px;box-shadow:8px 8px 0 var(--ink)}
.modal h2{margin:0 0 4px;font-size:28px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:12px}
.ritem{border:2px solid #d9e3ee;border-radius:16px;padding:8px 10px 10px;text-align:center;background:#fbfdff}
.ritem svg{width:100%;max-width:160px;height:auto}
.ritem b{font-family:Fredoka;font-size:18px;display:block}
.ritem span{font-size:14.5px;color:var(--muted);font-weight:700}
.rsec{font-family:Fredoka;font-size:21px;margin:18px 0 0;padding-bottom:4px;border-bottom:3px solid #eef2f7}
.rnote{background:#fff7dc;border-radius:14px;padding:10px 14px;margin-top:12px;font-weight:700;font-size:16px}
/* resultats */
.res{text-align:center}
.res .bigstars{font-size:58px;letter-spacing:6px;margin:6px 0}
.nota{font-family:Fredoka;font-size:84px;font-weight:700;line-height:1;margin:8px 0 0}
.nota small{font-size:30px;color:var(--muted)}
.review{text-align:left;margin-top:18px}
.review .it{border:2px solid #f2c3c5;background:#fff6f6;border-radius:14px;padding:10px 14px;margin-top:10px;font-size:16px}
.confetti{position:fixed;top:-20px;font-size:26px;pointer-events:none;z-index:60;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.05)}100%{transform:scale(1)}}
.pop{animation:pop .35s ease}
/* usuari */
.login{max-width:520px;margin:40px auto 0;text-align:center}
.login .qcard{padding:28px 24px 26px}
.login h2{font-size:clamp(26px,4vw,34px);margin:6px 0 4px}
.login p{color:var(--muted);font-size:18px;margin:0 0 16px}
.login input{width:100%;font-family:Fredoka,Nunito,sans-serif;font-size:26px;font-weight:600;text-align:center;padding:14px 16px;border:3px solid var(--ink);border-radius:18px;outline:none;color:var(--ink);background:#fffdf3}
.login input:focus{box-shadow:0 0 0 5px #ffe28a}
.login input.pin{font-size:34px;letter-spacing:14px;max-width:240px;display:block;margin:6px auto 0;padding:10px 12px 10px 26px}
.login .lbl{font-weight:800;color:var(--muted);font-size:15px}
.login .err{color:var(--ko);font-weight:800;min-height:24px;margin-top:8px}
.who{margin-top:22px;border-top:3px dashed #e3e9f1;padding-top:14px}
.who .lbl{font-weight:800;color:var(--muted);font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:10px}
.chip{background:#fff;border:2.5px solid var(--ink);border-radius:30px;padding:8px 16px;font-weight:800;font-size:17px;color:var(--ink);box-shadow:3px 3px 0 var(--ink)}
.chip:hover{background:#fff8de}
.userbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.hello{font-family:Fredoka;font-size:22px;font-weight:600}
/* recorda ben visible */
.rbanner{margin-top:24px;background:linear-gradient(120deg,#fff3c4,#ffe08a);border:3px solid var(--ink);border-radius:22px;box-shadow:6px 6px 0 var(--ink);padding:16px 18px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.rbanner .book{font-size:52px;line-height:1;animation:wiggle 2.6s ease-in-out infinite;flex:none}
.rbanner .txt{flex:1;min-width:220px}
.rbanner h3{margin:0;font-size:26px}
.rbanner p{margin:2px 0 0;font-weight:700;font-size:16px}
.rbanner .chips{justify-content:flex-start;margin-top:10px}
.rbtn{background:var(--sun);color:var(--ink);border:3px solid var(--ink);border-radius:14px;padding:9px 16px;font-weight:800;font-size:16px;box-shadow:3px 3px 0 var(--ink);animation:glow 2.4s ease-in-out infinite}
.rbtn:hover{filter:brightness(1.05);transform:translateY(-1px)}
.mrec{display:inline-block;margin-top:6px;background:#fff3c4;border:2px solid var(--ink);border-radius:10px;padding:3px 9px;font-weight:800;font-size:13.5px;color:var(--ink)}
.mrec:hover{background:var(--sun)}
.mcard{cursor:pointer}
.modal .rhead{background:linear-gradient(120deg,#fff3c4,#ffe08a);margin:-20px -22px 0;padding:16px 22px 14px;border-radius:21px 21px 0 0;border-bottom:3px solid var(--ink)}
.modal .rhead h2{font-size:32px}
.modal .rhead p{margin:4px 0 0;font-weight:700;font-size:17px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tab{background:#fff;border:2.5px solid var(--ink);border-radius:30px;padding:7px 13px;font-weight:800;font-size:15px;color:var(--ink)}
.tab.on{background:var(--ink);color:#fff}
@keyframes wiggle{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-12deg)}90%{transform:rotate(10deg)}95%{transform:rotate(-6deg)}}
@keyframes glow{0%,100%{box-shadow:3px 3px 0 var(--ink),0 0 0 0 rgba(255,201,60,.0)}50%{box-shadow:3px 3px 0 var(--ink),0 0 0 6px rgba(255,201,60,.45)}}
@media (max-width:560px){.rbanner{flex-direction:column;text-align:center}.rbanner .chips{justify-content:center}.rbanner .txt{min-width:0}}
@media (prefers-reduced-motion:reduce){.rbanner .book,.rbtn{animation:none}}
</style>

<body>
<div id="app"></div>
<script>
/* ============ Utilitats ============ */
const INK='#2b2d42';
const FILLS=['#E8557F','#B8A4D9','#3DA5E0','#F6D33C','#86C185','#EFB46A','#7FC8C2','#F28B66','#9AD0F5','#C7E07A'];
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1]],add=(a,b)=>[a[0]+b[0],a[1]+b[1]],mul=(v,k)=>[v[0]*k,v[1]*k];
const len=v=>Math.hypot(v[0],v[1]),norm=v=>{const l=len(v);return[v[0]/l,v[1]/l]};
const cross=(a,b)=>a[0]*b[1]-a[1]*b[0],dot=(a,b)=>a[0]*b[0]+a[1]*b[1];
const f=p=>p[0].toFixed(1)+','+p[1].toFixed(1);
const $=s=>document.querySelector(s);
const wrap=(inner,vb='0 0 200 140',cls='fig')=>`<svg class="${cls}" viewBox="${vb}" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
const polyEl=(p,fill,sw=3)=>`<polygon points="${p.map(f).join(' ')}" fill="${fill}" stroke="${INK}" stroke-width="${sw}" stroke-linejoin="round"/>`;
const lineEl=(a,b,col=INK,w=3,extra='')=>`<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}" stroke="${col}" stroke-width="${w}" stroke-linecap="round" ${extra}/>`;

function fit(pts,{rot=0,flip=false,W=200,H=140,pad=16}={}){
  let p=pts.map(([x,y])=>[flip?-x:x,y]);
  const r=rot*Math.PI/180,c=Math.cos(r),s=Math.sin(r);
  p=p.map(([x,y])=>[x*c-y*s,x*s+y*c]);
  const xs=p.map(q=>q[0]),ys=p.map(q=>q[1]);
  const minx=Math.min(...xs),maxx=Math.max(...xs),miny=Math.min(...ys),maxy=Math.max(...ys);
  const sc=Math.min((W-2*pad)/(maxx-minx||1),(H-2*pad)/(maxy-miny||1));
  const ox=(W-(maxx-minx)*sc)/2,oy=(H-(maxy-miny)*sc)/2;
  return p.map(([x,y])=>[ox+(x-minx)*sc,oy+(y-miny)*sc]);
}
function angleAt(p,i){const n=p.length,v=p[i],a=sub(p[(i-1+n)%n],v),b=sub(p[(i+1)%n],v);return Math.acos(Math.max(-1,Math.min(1,dot(a,b)/(len(a)*len(b)))))*180/Math.PI}
function arcPath(p,i,r){const n=p.length,v=p[i],u1=norm(sub(p[(i-1+n)%n],v)),u2=norm(sub(p[(i+1)%n],v));
  const s=add(v,mul(u1,r)),e=add(v,mul(u2,r)),sw=cross(u1,u2)>0?1:0;return `M${f(s)} A${r} ${r} 0 0 ${sw} ${f(e)}`}
function rightMark(p,i,s=13,col='#8E5BB5'){const n=p.length,v=p[i],u1=norm(sub(p[(i-1+n)%n],v)),u2=norm(sub(p[(i+1)%n],v));
  const a=add(v,mul(u1,s)),c=add(v,mul(u2,s)),b=add(a,mul(u2,s));return `<path d="M${f(a)} L${f(b)} L${f(c)}" fill="none" stroke="${col}" stroke-width="3"/>`}
function ticks(a,b,count,col=INK){const m=mul(add(a,b),.5),u=norm(sub(b,a)),nn=[-u[1],u[0]];let s='';
  for(let k=0;k<count;k++){const o=add(m,mul(u,(k-(count-1)/2)*6));s+=lineEl(add(o,mul(nn,-7)),add(o,mul(nn,7)),col,3)}return s}
function regPts(n,r=58,cx=100,cy=70){return Array.from({length:n},(_,i)=>{const a=-Math.PI/2+(n%2?0:Math.PI/n)+i*2*Math.PI/n;return[cx+r*Math.cos(a),cy+r*Math.sin(a)]})}
function irrPts(n){const st=2*Math.PI/n;const raw=Array.from({length:n},(_,i)=>{const a=-Math.PI/2+i*st+(Math.random()-.5)*st*.5;const r=32+rnd(34);return[r*Math.cos(a),r*Math.sin(a)]});return fit(raw)}

/* ============ Dades ============ */
const NOMS={3:'Triangle',4:'Quadrilàter',5:'Pentàgon',6:'Hexàgon',7:'Heptàgon',8:'Octàgon',9:'Enneàgon',10:'Decàgon'};
const ARTICLE=n=>({3:'un triangle',4:'un quadrilàter',5:'un pentàgon',6:'un hexàgon',7:'un heptàgon',8:'un octàgon',9:'un enneàgon',10:'un decàgon'}[n]);
const TRI_SIDES={
  'Equilàter':[[[0,0],[100,0],[50,-86.6]]],
  'Isòsceles':[[[0,0],[50,0],[25,-110]],[[0,0],[150,0],[75,-60]],[[0,0],[110,0],[55,-70]]],
  'Escalè':[[[20,115],[180,100],[130,30]],[[20,120],[170,55],[105,30]],[[0,0],[160,0],[40,-90]]]
};
const TRI_ANG={
  'Acutangle':[[[60,125],[150,125],[105,20]],[[30,120],[170,110],[90,25]],[[0,0],[100,0],[50,-86.6]]],
  'Rectangle':[[[0,0],[0,-100],[130,0]],[[0,0],[140,0],[140,-80]],[[0,0],[80,0],[0,-80]]],
  'Obtusangle':[[[15,110],[185,110],[60,60]],[[60,25],[185,95],[95,120]],[[0,0],[150,0],[-30,-50]]]
};
const QUAD={
  'Quadrat':[[[0,0],[80,0],[80,80],[0,80]]],
  'Rectangle':[[[0,0],[140,0],[140,70],[0,70]],[[0,0],[70,0],[70,120],[0,120]],[[0,0],[160,0],[160,60],[0,60]]],
  'Rombe':[[[50,0],[100,70],[50,140],[0,70]],[[60,0],[140,35],[60,70],[-20,35]]],
  'Romboide':[[[40,0],[160,0],[120,70],[0,70]],[[0,0],[110,0],[150,60],[40,60]]],
  'Trapezi':[[[35,0],[115,0],[150,70],[0,70]],[[0,0],[90,0],[140,70],[0,70]],[[0,0],[160,0],[115,70],[45,70]],[[65,0],[165,0],[125,70],[0,70]]],
  'Trapezoide':[[[20,90],[50,35],[150,25],[175,125]],[[50,50],[140,20],[175,120],[20,100]]]
};
const FAM={Quadrat:'Paral·lelogram',Rectangle:'Paral·lelogram',Rombe:'Paral·lelogram',Romboide:'Paral·lelogram',Trapezi:'Trapezi',Trapezoide:'Trapezoide'};
const IRR_SHAPES=[[[0,0],[30,0],[30,60],[75,60],[75,90],[0,90]],[[0,0],[50,0],[50,25],[95,25],[95,65],[0,65]]];

const EXP={
  'Punt':'Un <b>punt</b> és només un puntet: marca un lloc.',
  'Recta':'La <b>recta</b> no té ni principi ni final: continua sempre pels dos costats.',
  'Semirecta':'La <b>semirecta</b> té un punt d’inici (el puntet) i continua sense final per l’altre costat.',
  'Segment':'El <b>segment</b> té principi i final: un puntet a cada extrem.',
  'Rectes paral·leles':'Les <b>paral·leles</b> no es tallen mai, com les vies del tren.',
  'Rectes perpendiculars':'Les <b>perpendiculars</b> es tallen formant angles rectes, com una creu <b>+</b>.',
  'Rectes secants':'Les <b>secants</b> es tallen en un punt de manera inclinada, com una <b>X</b>.',
  'Equilàter':'<b>Equilàter</b>: tres costats iguals. Mira les marques: totes iguals!',
  'Isòsceles':'<b>Isòsceles</b>: dos costats iguals (els que tenen marca) i un de diferent.',
  'Escalè':'<b>Escalè</b>: tres costats desiguals. Cada costat té una marca diferent.',
  'Acutangle':'<b>Acutangle</b>: els tres angles són aguts (més tancats que un angle recte).',
  'TRectangle':'<b>Rectangle</b>: té un angle recte (com la cantonada d’un full). L’hem marcat amb un quadradet.',
  'Obtusangle':'<b>Obtusangle</b>: té un angle obtús (més obert que un angle recte). L’hem marcat en vermell.',
  'Paral·lelogram':'És un <b>paral·lelogram</b>: els costats oposats són paral·lels de dos en dos (mira els colors).',
  'Trapezi':'És un <b>trapezi</b>: només té dos costats oposats paral·lels (els blaus).',
  'Trapezoide':'És un <b>trapezoide</b>: no té cap costat paral·lel.',
  'Quadrat':'<b>Quadrat</b>: 4 costats iguals i 4 angles rectes.',
  'QRectangle':'<b>Rectangle</b>: 4 angles rectes i els costats iguals de dos en dos (dos de llargs i dos de curts).',

function lineFig(type,rot,after=false,cls='fig'){
  const L=66,a=[100-L,70],b=[100+L,70];let inner='';
  if(type==='Punt') inner=`<circle cx="100" cy="70" r="7" fill="${INK}"/>`;
  else{
    inner=lineEl(a,b,INK,4);
    if(type==='Semirecta'||type==='Segment') inner+=`<circle cx="${a[0]}" cy="70" r="7" fill="${INK}"/>`;
    if(type==='Segment') inner+=`<circle cx="${b[0]}" cy="70" r="7" fill="${INK}"/>`;
    if(after&&type!=='Segment'){ // fletxes que indiquen que continua
      const ar=(x,d)=>`<path d="M${x} 70 l${-12*d} -8 M${x} 70 l${-12*d} 8" stroke="#3DA5E0" stroke-width="3.5" fill="none" stroke-linecap="round"/>`;
      inner+=`<line x1="${b[0]+4}" y1="70" x2="${b[0]+22}" y2="70" stroke="#3DA5E0" stroke-width="3.5" stroke-dasharray="4 4"/>`+ar(b[0]+26,1);
      if(type==='Recta') inner+=`<line x1="${a[0]-4}" y1="70" x2="${a[0]-22}" y2="70" stroke="#3DA5E0" stroke-width="3.5" stroke-dasharray="4 4"/>`+ar(a[0]-26,-1);
    }
  }
  return wrap(`<g transform="rotate(${rot} 100 70)">${inner}</g>`,'0 0 200 140',cls);
}
function pairFig(type,rot,after=false,cls='fig'){

    if(after) inner+=`<path d="M70 52 V88 M130 52 V88" stroke="#3DA5E0" stroke-width="2" stroke-dasharray="4 4"/>`;}

}
function triFig(p,fill,mode=null,cls='fig'){
  let s=polyEl(p,fill);
  if(mode==='sides'){
    const L=[0,1,2].map(i=>len(sub(p[(i+1)%3],p[i])));const eq=(a,b)=>Math.abs(a-b)/Math.max(a,b)<.03;
    const info=triInfo(p);let cnt=[1,2,3];
    if(info.sidesCls==='Equilàter') cnt=[1,1,1];
    else if(info.sidesCls==='Isòsceles'){cnt=[0,0,0];for(let i=0;i<3;i++)for(let j=i+1;j<3;j++)if(eq(L[i],L[j])){cnt[i]=1;cnt[j]=1}}
    for(let i=0;i<3;i++) if(cnt[i]) s+=ticks(p[i],p[(i+1)%3],cnt[i]);
  }
  if(mode==='angles'){
    const info=triInfo(p);
    for(let i=0;i<3;i++){const a=info.A[i];
      if(Math.abs(a-90)<1.5) s+=rightMark(p,i,14);
      else if(a>90) s+=`<path d="${arcPath(p,i,18)}" fill="none" stroke="#E5484D" stroke-width="4"/>`;
      else if(info.angCls==='Acutangle') s+=`<path d="${arcPath(p,i,15)}" fill="none" stroke="#1d8a52" stroke-width="3.5"/>`;
    }
  }
  return wrap(s,'0 0 200 140',cls);
}
function triInfo(p){
  const L=[0,1,2].map(i=>len(sub(p[(i+1)%3],p[i])));const eq=(a,b)=>Math.abs(a-b)/Math.max(a,b)<.03;
  const sidesCls=(eq(L[0],L[1])&&eq(L[1],L[2]))?'Equilàter':(eq(L[0],L[1])||eq(L[1],L[2])||eq(L[0],L[2]))?'Isòsceles':'Escalè';
  const A=[0,1,2].map(i=>angleAt(p,i));const mx=Math.max(...A);
  const angCls=Math.abs(mx-90)<1.5?'Rectangle':mx>90?'Obtusangle':'Acutangle';
  return {L,A,sidesCls,angCls};
}

    const d=i=>norm(sub(p[(i+1)%4],p[i]));const par=(i,j)=>Math.abs(cross(d(i),d(j)))<.02;
    const cols=['#9aa0a6','#9aa0a6','#9aa0a6','#9aa0a6'];const pA=par(0,2),pB=par(1,3);
    if(pA){cols[0]=cols[2]='#1E6FD9'} if(pB){cols[1]=cols[3]=pA?'#F07C00':'#1E6FD9'}

  }
  return wrap(s,'0 0 200 140',cls);
}

function elemFig(p,{tap=false,hl=null}={}){

}

  return{type:'sort',key:'sq',prompt:'Classifica els quadrilàters',bins:[{id:'Paral·lelogram',label:'Paral·lelograms',desc:'costats paral·lels de dos en dos',color:'#E8557F'},{id:'Trapezi',label:'Trapezis',desc:'només dos costats paral·lels',color:'#3DA5E0'},{id:'Trapezoide',label:'Trapezoides',desc:'cap costat paral·lel',color:'#86C185'}],
    items,answerText:'Paral·lelograms · Trapezis · Trapezoides',explain:'<b>Paral·lelograms</b>: costats paral·lels de dos en dos. <b>Trapezis</b>: només dos costats paral·lels. <b>Trapezoides</b>: cap costat paral·lel.'}}
function gTF(topic){return()=>{const t=topic||pick(Object.keys(TF));const [s,v,e]=pick(TF[t]);return{type:'tf',key:'tf'+s,prompt:`Vertader o fals?<span class="sub" style="font-size:20px;color:#2b2d42;margin-top:12px">“${s}”</span>`,answer:v,answerText:v?'Vertader':'Fals',explain:e}}}

function showRecorda(id,opts={}){const old=$('.modal');if(old)old.remove();

  const draw=()=>{d.innerHTML=`<div class="box"><div class="rhead"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h2 class="ff">📖 Recorda!</h2><button class="ghostbtn" id="cl">Tanca ✕</button></div><p>${sub}</p></div>

    ${recordaHTML(cur)}<div class="row"><button class="primary" id="cl2">${opts.intro?'Ja ho tinc, comencem! 🚀':'Entesos! 👍'}</button></div></div>`;

  const close=()=>{d.remove();document.removeEventListener('keydown',esck);if(opts.onClose)opts.onClose()};

const app=$('#app');let S=null;
/* Usuari: es demana el nom cada vegada que s'obre l'aplicació. El progrés es guarda per a cada nom. */
let USER=null;
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ukey=n=>'geo4-u:'+n.trim().toLowerCase();
function lsGet(k,def){try{const v=localStorage.getItem(k);return v?JSON.parse(v):def}catch(e){return def}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function loadUser(){const u=USER?lsGet(ukey(USER),{}):{};u.stars=u.stars||{};u.seen=u.seen||{};return u}
function saveUser(u){if(USER)lsSet(ukey(USER),u)}
function knownUsers(){return lsGet('geo4-users',[])}
// existeix si té dades guardades o si ja havia entrat abans (llista interna, no es mostra mai)
function userExists(name){const k=name.trim().toLowerCase();return lsGet(ukey(name),null)!==null||knownUsers().some(n=>n.toLowerCase()===k)}
const cleanName=n=>n.trim().replace(/\s+/g,' ');
function login(name){name=cleanName(name);const rec=lsGet(ukey(name),null);if(rec&&rec.name)name=rec.name;USER=name;
  const list=knownUsers().filter(n=>n.toLowerCase()!==name.toLowerCase());list.push(name);lsSet('geo4-users',list);
  const u=loadUser();if(!u.name){u.name=name;u.created=Date.now()}saveUser(u);
  home();}
// noms alternatius lliures: maria1, maria2, maria_m, maria_ma...
function suggestNames(name){const out=[],max=20;const first=name[0].toLowerCase(),two=name.replace(/\s/g,'').slice(0,2).toLowerCase();
  const add=c=>{if(c.length<=max&&!userExists(c)&&!out.some(o=>o.toLowerCase()===c.toLowerCase()))out.push(c)};
  for(let i=1;out.length<2&&i<100;i++)add(name.slice(0,max-String(i).length)+i);
  add(name.slice(0,max-2)+'_'+first);add(name.slice(0,max-3)+'_'+two);
  for(let i=2;out.length<4&&i<100;i++)add(name.slice(0,max-2-String(i).length)+'_'+first+i);
  return out}
function loginCard(inner){S=null;USER=null;window.scrollTo(0,0);const old=$('.modal');if(old)old.remove();app.innerHTML=`<div class="login"><div class="qcard pop">${inner}</div></div>`}
/* PIN de 4 xifres: no es guarda tal qual, només una empremta */
function pinHash(name,pin){const t='geo4|'+name.trim().toLowerCase()+'|'+pin;let h=5381;for(let i=0;i<t.length;i++)h=((h*33)^t.charCodeAt(i))>>>0;return h.toString(36)}
function hasPin(name){const u=lsGet(ukey(name),null);return !!(u&&u.pin)}
function checkPin(name,pin){const u=lsGet(ukey(name),null);return !!(u&&u.pin===pinHash(name,pin))}
function setPin(name,pin){const u=lsGet(ukey(name),{})||{};u.pin=pinHash(name,pin);lsSet(ukey(name),u)}
const pinInput=(id,label)=>`<input id="${id}" class="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="••••" aria-label="${label}" autocomplete="off">`;
const onlyDigits=el=>el.addEventListener('input',()=>{el.value=el.value.replace(/\D/g,'').slice(0,4)});
function askName(){
  loginCard(`<div style="font-size:60px;line-height:1">📐👋</div><h2 class="ff">Hola! Com et dius?</h2><p>Escriu el teu nom per guardar les teves estrelles.</p>
    <form id="lf" autocomplete="off"><input id="nm" maxlength="20" placeholder="El teu nom" aria-label="El teu nom" autocomplete="off"><div class="err" id="er"></div><div class="row" style="margin-top:8px"><button class="primary" type="submit">Som-hi! 🚀</button></div></form>`);
  const nm=$('#nm');setTimeout(()=>nm.focus(),50);
  $('#lf').onsubmit=e=>{e.preventDefault();const v=cleanName(nm.value);if(!v){$('#er').textContent='Escriu el teu nom, si us plau ✏️';nm.focus();return}
    if(userExists(v))askSame(v);else choosePin(v)};}
// nom nou: tria un PIN i el repeteix
function choosePin(name,existing=false){
  loginCard(`<div style="font-size:56px;line-height:1">🔐</div><h2 class="ff">${existing?'Posa’t un PIN':'Hola, '+esc(name)+'!'}</h2><p>Tria un <b>PIN de 4 números</b> i recorda’l bé. El necessitaràs per tornar a entrar.</p>
    <form id="pf" autocomplete="off"><div class="lbl">El teu PIN</div>${pinInput('p1','El teu PIN')}<div class="lbl" style="margin-top:12px">Torna’l a escriure</div>${pinInput('p2','Repeteix el PIN')}
    <div class="err" id="er"></div><div class="row" style="margin-top:8px"><button class="primary" type="submit">Guarda i entra 🚀</button><button class="ghostbtn" type="button" id="bk">⟵ Torna enrere</button></div></form>
    <div class="rnote" style="margin-top:14px;font-size:15px">💡 No diguis el teu PIN a ningú. Pots apuntar-lo a l’agenda.</div>`);
  const p1=$('#p1'),p2=$('#p2');onlyDigits(p1);onlyDigits(p2);setTimeout(()=>p1.focus(),50);
  p1.addEventListener('input',()=>{if(p1.value.length===4)p2.focus()});
  $('#bk').onclick=askName;
  $('#pf').onsubmit=e=>{e.preventDefault();const er=$('#er');
    if(p1.value.length!==4){er.textContent='El PIN ha de tenir 4 números 🔢';p1.focus();return}
    if(p1.value!==p2.value){er.textContent='Els dos PIN no són iguals. Torna-ho a provar!';p2.value='';p2.focus();return}
    if(!existing&&userExists(name)){askSame(name);return}
    setPin(name,p1.value);login(name)};}
// el nom ja existeix: si ets tu, escriu el PIN; si no, tria un altre nom
function askSame(name){
  if(!hasPin(name)){ // usuari d'abans que hi hagués PIN
    loginCard(`<div style="font-size:56px;line-height:1">🤔</div><h2 class="ff">Ja hi ha algú que es diu «${esc(name)}»</h2><p>Ets tu, que ja havies jugat abans?</p>
      <div class="row"><button class="primary" id="yes">✅ Sí, sóc jo</button><button class="secondary" id="no">🙋 No, sóc una altra persona</button></div>
      <div class="row" style="margin-top:10px"><button class="ghostbtn" id="bk">⟵ Torna enrere</button></div>`);
    $('#yes').onclick=()=>choosePin(name,true);$('#no').onclick=()=>pickNew(name);$('#bk').onclick=askName;return}
  let fails=0;
  loginCard(`<div style="font-size:56px;line-height:1">🔐</div><h2 class="ff">Ja hi ha algú que es diu «${esc(name)}»</h2><p>Si ets tu, escriu el teu <b>PIN</b>.</p>
    <form id="pf" autocomplete="off">${pinInput('p1','El teu PIN')}<div class="err" id="er"></div><div class="row" style="margin-top:8px"><button class="primary" type="submit">Entra ✅</button></div></form>
    <div class="who"><div class="lbl">No ets tu?</div><div class="row" style="margin-top:8px"><button class="secondary" id="no">🙋 Sóc una altra persona</button><button class="ghostbtn" id="bk">⟵ Torna enrere</button></div>
    <div id="forgot"></div></div>`);
  const p1=$('#p1');onlyDigits(p1);setTimeout(()=>p1.focus(),50);
  $('#no').onclick=()=>pickNew(name);$('#bk').onclick=askName;
  const tryPin=()=>{if(checkPin(name,p1.value)){login(name);return}
    fails++;$('#er').textContent=fails<3?'Aquest PIN no és correcte. Torna-ho a provar! 🔁':'PIN incorrecte. Si no te’n recordes, mira a sota 👇';p1.value='';p1.focus();
    if(fails>=2)$('#forgot').innerHTML=`<div class="rnote" style="margin-top:12px;font-size:15px">🤷 Has oblidat el PIN? Demana ajuda a la mestra o el mestre, o comença amb un nom nou prement <b>Sóc una altra persona</b>.</div>`};
  p1.addEventListener('input',()=>{if(p1.value.length===4)tryPin()});
  $('#pf').onsubmit=e=>{e.preventDefault();if(p1.value.length!==4){$('#er').textContent='El PIN té 4 números 🔢';return}tryPin()};}
function pickNew(name){const sug=suggestNames(name);
  loginCard(`<div style="font-size:56px;line-height:1">✏️</div><h2 class="ff">Tria un nom diferent</h2><p>«${esc(name)}» ja està agafat. Pots triar un d'aquests:</p>
    <div class="chips">${sug.map((n,i)=>`<button class="chip" data-i="${i}">🙂 ${esc(n)}</button>`).join('')}</div>
    <div class="who"><div class="lbl">O escriu-ne un altre (per exemple, afegeix la inicial del cognom):</div>
    <form id="lf" autocomplete="off" style="margin-top:10px"><input id="nm" maxlength="20" placeholder="${esc(sug[0]||name)}" aria-label="Un altre nom" autocomplete="off"><div class="err" id="er"></div><div class="row" style="margin-top:8px"><button class="primary" type="submit">Som-hi! 🚀</button><button class="ghostbtn" type="button" id="bk">⟵ Torna enrere</button></div></form></div>`);
  app.querySelectorAll('.chip').forEach(b=>b.onclick=()=>choosePin(sug[+b.dataset.i]));
  $('#bk').onclick=askName;const nm=$('#nm');
  $('#lf').onsubmit=e=>{e.preventDefault();const v=cleanName(nm.value);if(!v){$('#er').textContent='Escriu un nom, si us plau ✏️';nm.focus();return}
    if(userExists(v)){$('#er').textContent=`«${v}» també està agafat. Prova'n un altre!`;nm.select();return}choosePin(v)};}
function loadStars(){return loadUser().stars}
function saveStars(id,v){const u=loadUser();const old=u.stars[id];const better=old===undefined||(typeof v==='string'?parseFloat(v.replace(',','.'))>parseFloat(String(old).replace(',','.')):v>old);if(better){u.stars[id]=v;saveUser(u)}}
function starStr(n){return '⭐'.repeat(n)+'☆'.repeat(3-n)}

function home(){if(!USER)return askName();S=null;const st=loadStars();window.scrollTo(0,0);const old=$('.modal');if(old)old.remove();
  app.innerHTML=`<div class="userbar"><div class="hello">👋 Hola, <span style="color:var(--acc)">${esc(USER)}</span>!</div><button class="ghostbtn" onclick="askName()">🔁 No sóc ${esc(USER)}</button></div>
  <div class="hero"><h1 class="ff"><span>📐</span> Repte de <span style="white-space:nowrap"><span style="color:#E8557F">G</span><span style="color:#3DA5E0">e</span><span style="color:#2fa36b">o</span><span style="color:#EFB46A">m</span><span style="color:#8E5BB5">e</span><span style="color:#E8557F">t</span><span style="color:#3DA5E0">r</span><span style="color:#2fa36b">i</span><span style="color:#EFB46A">a</span></span></h1><p>Supera les 5 missions i després fes l’examen final. Tu pots! 💪</p></div>

  <button class="mcard final" onclick="start(-1)"><div class="em">${FINAL.emoji}</div><div><h3 class="ff">${FINAL.title}</h3><small>${FINAL.desc}</small>${st.final?`<div class="stars" style="letter-spacing:0">Millor nota: <b>${st.final}</b></div>`:''}</div></button></div>
  <div class="rbanner"><div class="book">📖</div><div class="txt"><h3 class="ff">Recorda!</h3><p>El resum de la llibreta amb tots els dibuixos. Llegeix-lo abans de cada missió i torna-hi sempre que dubtis!</p>

  <div class="tip">Si t’equivoques, llegeix l’explicació i obre el <b>📖 Recorda</b>: així aprens! 🌟</div>`;}

function start(i){const m=i<0?FINAL:MISSIONS[i];const keys=new Set();
  let qs=m.gens.map(g=>{let q;for(let t=0;t<15;t++){q=g();if(!keys.has(q.key))break}keys.add(q.key);return q});
  const sorts=qs.filter(q=>q.type==='sort');qs=shuffle(qs.filter(q=>q.type!=='sort')).concat(sorts);
  S={m,qs,i:0,results:[]};renderQ();
  const u=loadUser();if(!u.seen[m.id]){u.seen[m.id]=1;saveUser(u);showRecorda(m.id,{intro:true})}}

const PRAISE=['Molt bé! 🎉','Genial! ⭐','Perfecte! 🙌','Ets una crac! 💪','Boníssim! 🌟','Ho has clavat! 🎯'];
function renderQ(){const q=S.qs[S.i],m=S.m;window.scrollTo(0,0);const ok=S.results.filter(r=>r.ok).length;
  app.innerHTML=`<div class="top"><button class="ghostbtn" onclick="home()">⟵ Menú</button><div class="mt">${m.emoji} ${m.title}</div><button class="rbtn" onclick="showRecorda('${m.id}')">📖 Recorda</button></div>
   <div class="prog"><div style="width:${S.i/S.qs.length*100}%"></div></div><div class="count">Pregunta ${S.i+1} de ${S.qs.length} · ✅ ${ok} encerts</div>
   <div class="qcard pop"><div class="prompt">${q.prompt}</div><div id="figbox">${q.svg||''}</div><div id="body"></div><div id="fb"></div></div>`;
  const body=$('#body');
  if(q.type==='choice'){body.innerHTML=`<div class="opts">${q.options.map(o=>`<button class="opt" data-v="${o}">${o}</button>`).join('')}</div>`;
    body.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const v=b.dataset.v,good=v===q.answer;
      body.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(x.dataset.v===q.answer)x.classList.add('right');else if(x===b)x.classList.add('wrong');else x.classList.add('dim')});
      finish(good)});}
  if(q.type==='tf'){body.innerHTML=`<div class="opts tf"><button class="opt" data-v="1">✔ Vertader</button><button class="opt" data-v="0">✘ Fals</button></div>`;
    body.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const v=b.dataset.v==='1',good=v===q.answer;
      body.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if((x.dataset.v==='1')===q.answer)x.classList.add('right');else x.classList.add('wrong')});finish(good)});}
  if(q.type==='tap'){body.innerHTML=`<div class="hint">Toca directament sobre el dibuix</div>`;const svg=$('#figbox svg');
    svg.addEventListener('click',e=>{if(S.qs[S.i]!==q||q._done)return;const el=e.target.closest('[data-el]');if(!el)return;q._done=true;finish(el.dataset.el===q.answer,el.dataset.el)});}
  if(q.type==='sort') renderSort(q);
}
function finish(good,picked){const q=S.qs[S.i];S.results.push({ok:good,q});
  if(q.svgAfter) $('#figbox').innerHTML=q.svgAfter;
  let msg;
  if(q.type==='tap'&&!good) msg=`Has tocat ${({vertex:'un vèrtex',side:'un costat',angle:'un angle',diagonal:'la diagonal'})[picked]}. Ara t’ensenyem ${({vertex:'un vèrtex',side:'un costat',angle:'un angle',diagonal:'la diagonal'})[q.answer]} en rosa. `;
  else msg=good?'':(q.type==='sort'?'':`La resposta correcta és <b>${q.answerText||q.answer}</b>. `);
  $('#fb').innerHTML=`<div class="fb ${good?'ok':'ko'} pop"><b class="big">${good?pick(PRAISE)+(Math.random()<.5?' '+esc(USER):''):'Uy, gairebé! 💡'}</b>${msg}${q.explain||''}</div>
   <div class="row">${good?'':`<button class="rbtn" style="font-size:18px;padding:12px 18px;border-radius:18px" onclick="showRecorda('${S.m.id}')">📖 Mira el Recorda</button>`}<button class="primary" id="nx">${S.i+1<S.qs.length?'Següent ➜':'Veure resultat 🏁'}</button></div>`;
  $('#nx').onclick=()=>{S.i++;if(S.i<S.qs.length)renderQ();else results()};
  $('#nx').scrollIntoView({behavior:'smooth',block:'nearest'});
}

/* ---- ordenar ---- */
function renderSort(q){const body=$('#body');const st=q._st||(q._st={pos:{},sel:null,marks:{},first:null,done:false,tries:0});
  const card=it=>`<div class="card ${st.sel===it.id?'sel':''} ${st.marks[it.id]||''}" data-id="${it.id}">${it.svg}</div>`;
  const inTray=q.items.filter(it=>!st.pos[it.id]);const all=inTray.length===0;
  body.innerHTML=`<div class="hint">Arrossega cada figura al seu calaix (o toca la figura i després el calaix)</div>
   <div class="tray" data-bin="tray">${inTray.map(card).join('')||'<span class="hint" style="align-self:center">Totes col·locades! Prem <b>Comprova</b> 👇</span>'}</div>
   <div class="bins">${q.bins.map(b=>`<div class="bin" data-bin="${b.id}" style="--c:${b.color}"><div class="bt">${b.label}</div><div class="bd">${b.desc}</div><div class="bc">${q.items.filter(it=>st.pos[it.id]===b.id).map(card).join('')}</div></div>`).join('')}</div>
   ${st.done?'':`<div class="row"><button class="primary" id="chk" ${all?'':'disabled'}>Comprova ✔</button>${st.tries>0?'<button class="secondary" id="sol">Veure la solució</button>':''}</div>`}`;
  if(st.done) return;
  const move=(id,bin)=>{if(bin==='tray')delete st.pos[id];else st.pos[id]=bin;delete st.marks[id];st.sel=null;renderSort(q)};
  body.querySelectorAll('[data-bin]').forEach(b=>b.addEventListener('click',()=>{if(st.sel)move(st.sel,b.dataset.bin)}));
  body.querySelectorAll('.card').forEach(c=>{c.addEventListener('click',e=>e.stopPropagation());
    c.addEventListener('pointerdown',e=>{e.preventDefault();const sx=e.clientX,sy=e.clientY,r=c.getBoundingClientRect();let ghost=null,over=null;
      try{c.setPointerCapture(e.pointerId)}catch(_){}
      const mv=ev=>{if(!ghost&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>6){ghost=c.cloneNode(true);ghost.classList.add('ghost');ghost.classList.remove('sel');ghost.style.width=r.width+'px';document.body.appendChild(ghost);c.classList.add('dragging')}
        if(ghost){ghost.style.left=(ev.clientX-r.width/2)+'px';ghost.style.top=(ev.clientY-r.height/2)+'px';
          const el=document.elementFromPoint(ev.clientX,ev.clientY);const b=el&&el.closest('[data-bin]');if(over&&over!==b)over.classList.remove('over');if(b){b.classList.add('over');over=b}}};
      const up=ev=>{c.removeEventListener('pointermove',mv);c.removeEventListener('pointerup',up);c.removeEventListener('pointercancel',up);
        if(ghost){ghost.remove();c.classList.remove('dragging');if(over)over.classList.remove('over');const el=document.elementFromPoint(ev.clientX,ev.clientY);const b=el&&el.closest('[data-bin]');if(b)move(c.dataset.id,b.dataset.bin)}
        else{st.sel=st.sel===c.dataset.id?null:c.dataset.id;renderSort(q)}};
      c.addEventListener('pointermove',mv);c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up);});});
  const chk=$('#chk');if(chk)chk.onclick=()=>{st.tries++;let allOk=true;q.items.forEach(it=>{const ok=st.pos[it.id]===it.bin;st.marks[it.id]=ok?'ok':'ko';if(!ok)allOk=false});
    if(st.first===null)st.first=allOk;
    if(allOk){st.done=true;renderSort(q);finish(st.first);if(!st.first)$('#fb .big').textContent='Ara sí! 👏 (a la primera no ha sortit)';}
    else{renderSort(q);$('#fb').innerHTML=`<div class="fb info pop"><b class="big">Quasi! 🔍</b>Les figures amb vora <b style="color:#e5484d">vermella</b> no estan al lloc correcte. Mou-les i torna a comprovar.<br><small>${q.explain}</small></div>`}};
  const sol=$('#sol');if(sol)sol.onclick=()=>{q.items.forEach(it=>{st.pos[it.id]=it.bin;st.marks[it.id]='ok'});st.done=true;if(st.first===null)st.first=false;renderSort(q);finish(false)};
}

/* ---- resultats ---- */
function confetti(){const em=['🎉','⭐','🌟','✨','🔺','🟪','📐'];for(let i=0;i<40;i++){const s=document.createElement('div');s.className='confetti';s.textContent=pick(em);s.style.left=Math.random()*100+'vw';s.style.animationDuration=(2+Math.random()*2.5)+'s';s.style.animationDelay=Math.random()*.8+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),5500)}}
function results(){const m=S.m,N=S.results.length,ok=S.results.filter(r=>r.ok).length,pct=ok/N;window.scrollTo(0,0);
  const stars=pct>=.9?3:pct>=.7?2:pct>=.5?1:0;
  const errs=S.results.filter(r=>!r.ok);
  const review=errs.length?`<div class="review"><h3 class="ff" style="margin:0">Per repassar 🔍</h3>${errs.map(r=>`<div class="it" style="display:flex;gap:12px;align-items:center">${r.q.svgAfter?`<div style="width:110px;flex:none">${r.q.svgAfter}</div>`:''}<div>${r.q.prompt.replace(/<span class="sub"[^>]*>/,' — ').replace(/<\/span>/,'')}<br>✅ <b>${r.q.answerText||(r.q.type==='tf'?(r.q.answer?'Vertader':'Fals'):r.q.answer)}</b></div></div>`).join('')}</div>`:'';
  let head;
  if(m.final){const nota=Math.round(pct*100)/10;saveStars('final',String(nota).replace('.',','));
    const msg=nota>=9?'Excel·lent! Estàs preparadíssima per a l’examen! 🏆':nota>=7?'Molt bé! Repassa els errors i serà perfecte. 👏':nota>=5?'Aprovat! Repassa les missions on has fallat i torna-ho a provar. 💪':'Encara cal practicar una mica. Fes les missions i torna-ho a provar! 📚';
    head=`<div class="nota">${String(nota).replace('.',',')}<small> / 10</small></div><p style="font-size:20px;font-weight:800">${ok} de ${N} encerts</p><p style="font-size:19px">${msg}</p>`;}
  else{saveStars(m.id,stars);const msg=stars===3?'Missió superada amb nota! 🏅':stars===2?'Molt bé! Una mica més i tindràs les 3 estrelles.':stars===1?'Bé! Mira el “Recorda” i torna-ho a provar.':'Cal practicar més: llegeix el “Recorda” i torna-hi! 💪';
    head=`<div class="bigstars">${starStr(stars)}</div><p style="font-size:22px;font-weight:800;margin:4px 0">${ok} de ${N} encerts</p><p style="font-size:19px">${msg}</p>`;}
  app.innerHTML=`<div class="qcard res pop"><h2 class="ff" style="margin:0;font-size:30px">${m.emoji} ${m.title}</h2><p style="margin:4px 0 0;font-weight:800;color:var(--muted)">🙂 ${esc(USER)}</p>${head}
    <div class="row"><button class="primary" onclick="start(${m.final?-1:MISSIONS.indexOf(m)})">🔄 Torna-ho a provar</button>${pct<1?`<button class="rbtn" style="font-size:18px;padding:13px 20px;border-radius:18px" onclick="showRecorda('${m.id}')">📖 Repassa el Recorda</button>`:''}<button class="secondary" onclick="home()">🏠 Menú</button>${!m.final&&MISSIONS.indexOf(m)<MISSIONS.length-1?`<button class="secondary" onclick="start(${MISSIONS.indexOf(m)+1})">Següent missió ➜</button>`:''}</div>${review}</div>`;
  if(pct>=.7)confetti();}
// les notes d'abans que hi hagués usuaris no són de ningú: s'esborren
try{localStorage.removeItem('geo4-stars')}catch(e){}
askName();
</script>
